[project]
name = "russian-flashcards"
version = "0.1.0"
description = "Russian vocabulary flashcard app with spaced repetition"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "kivymd>=1.1.0",
    "pymorphy3",
    "pymorphy3-dicts-ru",
    "plyer",
    "schedule",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.0",
    "torch",
    "torchaudio",
]

[project.optional-dependencies]
dev = ["pytest", "black"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.kivy]
log_level = "info"

[tool.kivy.modules]
android = []

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
